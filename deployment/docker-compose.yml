# version: "3.8"

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_management}
      POSTGRES_USER: ${POSTGRES_USER:-opensource}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks: [ incident-platform ]

  incident-management:
    image: ims/incident-management:local
    # container_name removed to allow scaling (docker compose up --scale incident-management=N)
    build:
      context: ../incident-management-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://opensource:placeholder@postgres:5432/incident_management}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      ONCALL_BASE_URL: ${ONCALL_BASE_URL:-http://oncall-service:8003}
      NOTIFICATION_BASE_URL: ${NOTIFICATION_BASE_URL:-http://notification-service:8004}
      TZ: ${TZ:-UTC}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: incident-management-service
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    # No fixed host port — access via gateway (:8010) to allow scaling
    expose:
      - "8002"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8002/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks: [ incident-platform ]

  alert-ingestion:
    image: ims/alert-ingestion:local
    # container_name removed to allow scaling
    build:
      context: ../alert-ingestion-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://opensource:placeholder@postgres:5432/incident_management}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      INCIDENT_MGMT_BASE_URL: ${INCIDENT_MGMT_BASE_URL:-http://incident-management:8002}
      TZ: ${TZ:-UTC}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: alert-ingestion-service
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [ incident-platform ]

  oncall-service:
    image: ims/oncall:local
    container_name: oncall-service
    build:
      context: ../oncall-service
      dockerfile: Dockerfile
    environment:
      INCIDENT_MGMT_BASE_URL: ${INCIDENT_MGMT_BASE_URL:-http://incident-management:8002}
      NOTIFICATION_BASE_URL: ${NOTIFICATION_BASE_URL:-http://notification-service:8004}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://opensource:placeholder@postgres:5432/incident_management}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: oncall-service
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ONCALL_PORT:-8003}:8003"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8003/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [ incident-platform ]

  notification-service:
    image: ims/notification:local
    container_name: notification-service
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    environment:
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_FROM: ${RESEND_FROM:-noreply@transcendence.games}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: notification-service
    secrets:
      - resend_api_key
    ports:
      - "${NOTIFICATION_PORT:-8004}:8004"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8004/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [ incident-platform ]

  web-ui:
    image: ims/web-ui:local
    container_name: web-ui
    build:
      context: ../web-ui-service
      dockerfile: Dockerfile
    depends_on:
      incident-management:
        condition: service_started
    ports:
      - "${WEB_UI_PORT:-8080}:8080"
    entrypoint: [ "nginx", "-g", "daemon off;" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q ok" ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks: [ incident-platform ]

  gateway:
    image: ims/gateway:local
    container_name: gateway
    build:
      context: ../gateway-service
      dockerfile: Dockerfile
    environment:
      INCIDENT_MGMT_BASE_URL: ${INCIDENT_MGMT_BASE_URL:-http://incident-management:8002}
    depends_on:
      incident-management:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8010}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [ incident-platform ]

  # ---------- Observability Stack ----------

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ../monitoring-service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring-service/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks: [ incident-platform ]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring-service/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring-service/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q ok" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [ incident-platform ]

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    volumes:
      - ../monitoring-service/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [ incident-platform ]

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - ../monitoring-service/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks: [ incident-platform ]

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4317}:4317"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:16687/ || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [ incident-platform ]

volumes:
  postgres_data:
    name: postgres_data
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  loki_data:
    name: loki_data

networks:
  incident-platform:
    driver: bridge

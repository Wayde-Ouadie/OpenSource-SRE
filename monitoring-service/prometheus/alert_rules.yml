## TODO: Add subject specific rules as well as for each service
groups:
  # GENERAL - Core infrastructure monitoring
  - name: general
    rules:
      # [CRITICAL] monitored target is unreachable
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

  # HOST METRICS - System-level resource monitoring
  - name: host_metrics
    rules:
      # [WARNING] system load average exceeds threshold
      - alert: HighCpuLoad
        expr: node_load1 > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU load is > 1.5 for 2 minutes. Value: {{ $value }}"

      # [WARNING] root filesystem has less than 10% free space
      - alert: LowDiskSpace
        expr: node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk usage is above 90%."

  - name: containers
    rules:
      # [WARNING] any container exceeds 90% memory usage
      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{image!=""} / container_spec_memory_limit_bytes{image!=""} * 100 > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory"
          description: "Usage is at {{ $value }}% of limit."

  # SRE METRICS - MTTA / MTTR / Escalation thresholds
  - name: sre_metrics
    rules:
      # [WARNING] p95 MTTA exceeds 15 minutes
      - alert: HighMTTA
        expr: histogram_quantile(0.95, sum(rate(incident_mtta_seconds_bucket[1h])) by (le)) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 MTTA exceeds 15 minutes"
          description: "p95 mean time to acknowledge is {{ $value }}s (threshold: 900s)."

      # [CRITICAL] p95 MTTR exceeds 2 hours
      - alert: HighMTTR
        expr: histogram_quantile(0.95, sum(rate(incident_mttr_seconds_bucket[1h])) by (le)) > 7200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "p95 MTTR exceeds 2 hours"
          description: "p95 mean time to resolve is {{ $value }}s (threshold: 7200s)."

      # [WARNING] escalation rate is high
      - alert: HighEscalationRate
        expr: sum(rate(escalations_total[10m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High escalation rate"
          description: "Escalation rate is {{ $value }}/s over the last 10 minutes."

      # [WARNING] too many open critical incidents
      - alert: TooManyCriticalIncidents
        expr: sum(incidents_open{severity="critical"}) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "More than 5 critical incidents open"
          description: "There are {{ $value }} critical incidents currently open."